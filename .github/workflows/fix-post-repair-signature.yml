name: Fix post-repair persistence signature

on:
  push:
    branches:
      - fix/degraded-ledger-conflict

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/degraded-ledger-conflict
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply exact patch
        run: node scripts/_fix-post-repair-signature.mjs
      - name: Commit production fix and regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_fix-post-repair-signature.mjs .github/workflows/fix-post-repair-signature.yml
          git add server/orchestrator.js test/unit/orchestrator-degraded-ledger-persistence.test.js
          git diff --cached --check
          git commit -m "fix: sign degraded persistence after repair"
          git push origin HEAD:fix/degraded-ledger-conflict
