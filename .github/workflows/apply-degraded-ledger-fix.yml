name: Apply degraded ledger fix

on:
  push:
    branches:
      - fix/degraded-ledger-conflict

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/degraded-ledger-conflict
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact patch
        run: node scripts/apply-degraded-ledger-fix.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/orchestrator.js public/app.js public/i18n-core.js public/strings.js test/unit/session-scenarios.test.js test/unit/orchestrator-degraded-ledger-outcome.test.js test/unit/orchestrator-degraded-ledger-persistence.test.js test/integration/unresolved-outcome-discovery.test.js
          git diff --cached --check
          git commit -m "fix: implement degraded ledger conflict outcome"
          git push origin HEAD:fix/degraded-ledger-conflict
